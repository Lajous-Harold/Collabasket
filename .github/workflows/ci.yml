name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - v2/expo-supabase

jobs:
  typecheck-and-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint
